// ─── THREE.JS SETUP (CON SFONDO TRASPARENTE SUL GRADIENTE BLU CREPUSCOLARE) ─
const canvas = document.getElementById('c');
const scene = new THREE.Scene();
const W = () => window.innerWidth, H = () => window.innerHeight;
const camera = new THREE.PerspectiveCamera(55, W()/H(), 0.1, 8000);
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(W(), H());

// Camera spherical coords
let sph = { theta: 0.4, phi: 1.12, r: 360 };
let tgt = { ...sph };
function applyCam() {
  camera.position.set(
    sph.r * Math.sin(sph.phi) * Math.sin(sph.theta),
    sph.r * Math.cos(sph.phi),
    sph.r * Math.sin(sph.phi) * Math.cos(sph.theta)
  );
  camera.lookAt(0, 0, 0);
}
applyCam();

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function makeCanvas(size, fn) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  fn(c.getContext('2d'), size);
  return new THREE.CanvasTexture(c);
}

const PALETTES = {
  purple: ['#2e1065','#5b21b6','#8b5cf6','#c4b5fd','#f5f3ff'],
  red:    ['#450a0a','#991b1b','#dc2626','#f87171','#fee2e2'],
  orange: ['#431407','#9a3412','#ea580c','#fb923c','#ffedd5'],
  teal:   ['#042f2e','#065f46','#059669','#34d399','#d1fae5'],
  blue:   ['#172554','#1e40af','#2563eb','#60a5fa','#dbeafe'],
  gold:   ['#451a03','#92400e','#d97706','#fbbf24','#fef3c7'],
  pink:   ['#500724','#9d174d','#db2777','#f472b6','#fce7f3'],
  cyan:   ['#083344','#155e75','#0891b2','#22d3ee','#cffafe'],
  emerald:['#022c22','#065f46','#10b981','#6ee7b7','#d1fae5'],
  indigo: ['#1e1b4b','#3730a3','#4f46e5','#818cf8','#e0e7ff'],
  sky:    ['#0c4a6e','#0369a1','#0284c7','#38bdf8','#e0f2fe'],
  marble: ['#262626','#525252','#a37e3b','#d4af37','#ffffff'],
};

function planetTex(type) {
  return makeCanvas(512, (ctx, s) => {
    const pal = PALETTES[type] || PALETTES.gold;
    const g = ctx.createLinearGradient(0, 0, s, s);
    g.addColorStop(0, pal[0]); g.addColorStop(0.3, pal[1]);
    g.addColorStop(0.55, pal[2]); g.addColorStop(0.75, pal[3]); g.addColorStop(1, pal[4]);
    ctx.fillStyle = g; ctx.fillRect(0, 0, s, s);
    for (let i = 0; i < 18; i++) {
      const y = Math.random()*s, h = Math.random()*35+8;
      const bg = ctx.createLinearGradient(0, y, 0, y+h);
      bg.addColorStop(0,'rgba(255,255,255,0)');
      bg.addColorStop(0.5,`rgba(255,255,255,${Math.random()*0.16})`);
      bg.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle = bg; ctx.fillRect(0, y, s, h);
    }
    for (let i = 0; i < 4; i++) {
      const x=Math.random()*s, y=Math.random()*s, r=Math.random()*25+8;
      const sg=ctx.createRadialGradient(x,y,0,x,y,r);
      sg.addColorStop(0,'rgba(255,255,255,0.22)'); sg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=sg; ctx.beginPath(); ctx.ellipse(x,y,r,r*0.55,0,0,Math.PI*2); ctx.fill();
    }
  });
}

function sunTex() {
  return makeCanvas(512, (ctx, s) => {
    const g=ctx.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
    g.addColorStop(0,'#fffff0'); g.addColorStop(0.3,'#fff176');
    g.addColorStop(0.6,'#ffd700'); g.addColorStop(0.85,'#ff8c00'); g.addColorStop(1,'#ff4500');
    ctx.fillStyle=g; ctx.fillRect(0,0,s,s);
    for(let i=0;i<300;i++){
      const x=Math.random()*s,y=Math.random()*s,r=Math.random()*12+2;
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,${160+Math.random()*70},0,${Math.random()*0.25})`; ctx.fill();
    }
  });
}

(function(){
  const geo=new THREE.BufferGeometry(), n=4500;
  const pos=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const t=Math.random()*Math.PI*2, p=Math.acos(2*Math.random()-1), r=700+Math.random()*350;
    pos[i*3]=r*Math.sin(p)*Math.cos(t); pos[i*3+1]=r*Math.sin(p)*Math.sin(t); pos[i*3+2]=r*Math.cos(p);
  }
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({color:0xffffff,size:1.0,transparent:true,opacity:0.9,sizeAttenuation:true})));
})();

[[0x60a5fa,500,1400],[0xc084fc,400,1100],[0x38bdf8,350,1000]].forEach(([col,n,sp])=>{
  const geo=new THREE.BufferGeometry(), pos=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    pos[i*3]=(Math.random()-0.5)*sp; pos[i*3+1]=(Math.random()-0.5)*sp*0.25; pos[i*3+2]=(Math.random()-0.5)*sp;
  }
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({color:col,size:2.4,transparent:true,opacity:0.18,sizeAttenuation:true})));

  new THREE.SphereGeometry(24, 48, 48),

);

sunGroup.add(sunMesh);
[1,2,3,4].forEach(i=>{
  const g=new THREE.Mesh(new THREE.SphereGeometry(24+i*5,32,32),
    new THREE.MeshBasicMaterial({color:0xFFD700,transparent:true,opacity:0.08/i,side:THREE.BackSide}));

// ─── PLANETS, LABELS & QUICK DOCK ────────────────────────────────────────────
const planets=[], labelEls=[], dockEls=[], angles=APPS.map(a=>a.angle);
const labelsDiv=document.getElementById('labels-container');
const dockDiv=document.getElementById('quick-dock');

function focusPlanet(idx) {
  const app = APPS[idx];
  // Ruota dolcemente la visuale verso il pianeta selezionato
  const targetAngle = Math.atan2(planets[idx].position.x, planets[idx].position.z);
  tgt.theta = targetAngle;
  tgt.phi = 1.18;
  tgt.r = Math.max(150, Math.min(430, app.orbit + 115));
  openPanel(app, idx);
}

APPS.forEach((app,i)=>{
  // Orbit ring (più visibile sullo sfondo blu chiaro)
  const pts=[]; for(let j=0;j<=128;j++){
    const a=(j/128)*Math.PI*2;
    pts.push(new THREE.Vector3(Math.cos(a)*app.orbit,0,Math.sin(a)*app.orbit));
  }
  const orbitGeo=new THREE.BufferGeometry().setFromPoints(pts);
  scene.add(new THREE.Line(orbitGeo,new THREE.LineBasicMaterial({color:0xbfdbfe,transparent:true,opacity:0.16})));

  // Planet mesh
  const mesh=new THREE.Mesh(
    new THREE.SphereGeometry(app.size,40,40),
    new THREE.MeshPhongMaterial({map:planetTex(app.type),shininess:35,specular:new THREE.Color(0x444444)})
  );
  mesh.rotation.z=app.tilt;
  mesh.userData={app,idx:i};

  // Atmosphere
  mesh.add(new THREE.Mesh(
    new THREE.SphereGeometry(app.size*1.2,32,32),
    new THREE.MeshBasicMaterial({color:app.glow,transparent:true,opacity:0.18,side:THREE.BackSide})
  ));

  // Saturn-like rings
  if(app.rings){
    const rg=new THREE.RingGeometry(app.size*1.45,app.size*2.3,80);
    const rm=new THREE.MeshBasicMaterial({color:0xFFB347,side:THREE.DoubleSide,transparent:true,opacity:0.55});
    const ring=new THREE.Mesh(rg,rm); ring.rotation.x=Math.PI/3;
    mesh.add(ring);
  }

  // Moon
  if(app.moon){
    const moon=new THREE.Mesh(
      new THREE.SphereGeometry(app.size*0.28,16,16),
      new THREE.MeshPhongMaterial({color:0xe2e8f0,shininess:15})
    );
    moon.userData={isMoon:true}; mesh.add(moon);
  }

  mesh.position.set(Math.cos(angles[i])*app.orbit, 0, Math.sin(angles[i])*app.orbit);
  scene.add(mesh);
  planets.push(mesh);

  // Etichetta cliccabile sopra il pianeta
  const el=document.createElement('div');
  el.className='planet-label';
  el.textContent=app.icon+' '+app.name;
  el.style.borderColor=app.glow+'88';
  el.style.color=app.glow;
  el.addEventListener('click', (e) => {
    e.stopPropagation();
    focusPlanet(i);
  });
  labelsDiv.appendChild(el);
  labelEls.push(el);

  // Pulsante rapido nella barra in basso
  const pill=document.createElement('button');
  pill.className='dock-pill';
  pill.textContent=app.icon+' '+app.name;
  pill.style.borderColor=app.glow+'66';
  pill.addEventListener('click', () => focusPlanet(i));
  dockDiv.appendChild(pill);
  dockEls.push(pill);
});

// ─── INTERAZIONE SEMPLIFICATA (ROTAZIONE SOLO CON TASTO MOUSE PREMUTO) ───────
const ray=new THREE.Raycaster();
const mouse=new THREE.Vector2(-99, -99);
let isPointerDown=false, isDrag=false, downPos={x:0,y:0}, lastPos={x:0,y:0}, downTime=0, hovered=null;
const tt=document.getElementById('tooltip');

canvas.addEventListener('mousedown', e => {
  if (e.button !== 0 && e.button !== 2) return;
  isPointerDown = true;
  isDrag = false;
  downPos = { x: e.clientX, y: e.clientY };
  lastPos = { x: e.clientX, y: e.clientY };
  downTime = Date.now();
});

window.addEventListener('mousemove', e => {
  mouse.x = (e.clientX / W()) * 2 - 1;
  mouse.y = -(e.clientY / H()) * 2 + 1;

  // Muove lo spazio SOLO se il tasto del mouse è tenuto premuto
  if (isPointerDown) {
    const totalDx = e.clientX - downPos.x;
    const totalDy = e.clientY - downPos.y;
    if ((totalDx * totalDx + totalDy * totalDy) > 25) {
      isDrag = true;
    }
    if (isDrag) {
      const dx = e.clientX - lastPos.x;
      const dy = e.clientY - lastPos.y;
      tgt.theta -= dx * 0.0055;
      tgt.phi -= dy * 0.0055;
      tgt.phi = Math.max(0.22, Math.min(Math.PI - 0.22, tgt.phi));
    }
    lastPos = { x: e.clientX, y: e.clientY };
  }

  tt.style.left = (e.clientX + 16) + 'px';
  tt.style.top = (e.clientY - 16) + 'px';
});

window.addEventListener('mouseup', e => {
  if (!isPointerDown) return;
  const wasDrag = isDrag;
  isPointerDown = false;
  isDrag = false;

  if (!wasDrag && Date.now() - downTime < 500 && e.target === canvas) {
    ray.setFromCamera(mouse, camera);
    const sunHit = ray.intersectObject(sunMesh);
    if (sunHit.length) {
      window.open('https://www.serrastudio.it', '_blank');
      return;
    }
    // Accetta clic sia sul pianeta sia sul suo alone atmosferico per facilitare la selezione
    const h = ray.intersectObjects(planets, true);
    if (h.length) {
      let obj = h[0].object;
      while (obj && !obj.userData.app && obj.parent) obj = obj.parent;
      if (obj && obj.userData.app) {
        focusPlanet(obj.userData.idx);
      }
    }
  }
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  tgt.r = Math.max(70, Math.min(800, tgt.r + e.deltaY * 0.35));
}, { passive: false });

// Touch mobile
let lp=null;
canvas.addEventListener('touchstart',e=>{lp={x:e.touches[0].clientX,y:e.touches[0].clientY};});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(lp){
    tgt.theta-=(e.touches[0].clientX-lp.x)*0.007;
    tgt.phi-=(e.touches[0].clientY-lp.y)*0.007;
    tgt.phi=Math.max(0.22,Math.min(Math.PI-0.22,tgt.phi));
    lp={x:e.touches[0].clientX,y:e.touches[0].clientY};
  }
},{passive:false});

// ─── PANEL ───────────────────────────────────────────────────────────────────
function openPanel(app, idx){
  document.getElementById('panel-icon').textContent=app.icon;
  document.getElementById('panel-name').textContent=app.name;
  document.getElementById('panel-name').style.color=app.glow;
  document.getElementById('panel-desc').textContent=app.desc;
  document.getElementById('panel-badge').textContent='🚀 App SerraStudio — VPS Cloud';
  const btn=document.getElementById('panel-btn');
  btn.href=app.url;
  btn.style.background=`linear-gradient(135deg,${app.glow}bb,${app.glow})`;
  document.getElementById('panel').classList.add('open');
  dockEls.forEach((el, i) => el.classList.toggle('active', i === idx));
}
function closePanel(){
  document.getElementById('panel').classList.remove('open');
  dockEls.forEach(el => el.classList.remove('active'));
}
window.closePanel=closePanel;

// ─── LABEL PROJECTION ────────────────────────────────────────────────────────
function projectToScreen(pos){
  const v=pos.clone().project(camera);
  return {x:(v.x*0.5+0.5)*W(), y:(-v.y*0.5+0.5)*H(), z:v.z};
}

// ─── ANIMATION ───────────────────────────────────────────────────────────────
let t=0;
function animate(){
  requestAnimationFrame(animate);
  t+=0.016;

  // smooth camera
  sph.theta+=(tgt.theta-sph.theta)*0.09;
  sph.phi+=(tgt.phi-sph.phi)*0.09;
  sph.r+=(tgt.r-sph.r)*0.09;
  applyCam();

  // sun spin
  sunMesh.rotation.y+=0.0015;

  // planets orbit (si ferma dolcemente quando passi il mouse su un pianeta per cliccarlo comodamente)
  const orbitFactor = hovered ? 0.0 : 1.0;
  APPS.forEach((app,i)=>{
    angles[i]+=app.speed * orbitFactor;
    planets[i].position.set(Math.cos(angles[i])*app.orbit, 0, Math.sin(angles[i])*app.orbit);
    planets[i].rotation.y+=0.005;
    planets[i].children.forEach(ch=>{
      if(ch.userData.isMoon){
        ch.position.set(Math.cos(t*1.8)*app.size*2.8, 0, Math.sin(t*1.8)*app.size*2.8);
      }
    });

    const sc=projectToScreen(planets[i].position);
    if(sc.z<1){
      labelEls[i].style.left=sc.x+'px';
      labelEls[i].style.top=sc.y+'px';
      labelEls[i].classList.add('visible');
    } else {
      labelEls[i].classList.remove('visible');
    }
  });

  // hover
  if(!isPointerDown){
    ray.setFromCamera(mouse,camera);
    const sunHits=ray.intersectObject(sunMesh);
    const hits=ray.intersectObjects(planets, true);
    if(sunHits.length && (!hits.length || sunHits[0].distance < hits[0].distance)){
      canvas.style.cursor='pointer';
      document.getElementById('tt-name').textContent='☀️ SerraStudio';
      document.getElementById('tt-name').style.color='#FFD700';
      document.getElementById('tt-desc').textContent='Visita il sito ufficiale di SerraStudio';
      document.getElementById('tt-price').textContent='🌐 www.serrastudio.it';
      tt.style.display='block';
      if(hovered){ hovered.scale.set(1,1,1); hovered=null; }
    } else if(hits.length){
      let p=hits[0].object;
      while(p && !p.userData.app && p.parent) p=p.parent;
      const app=p ? p.userData.app : null;
      if(app){
        canvas.style.cursor='pointer';
        document.getElementById('tt-name').textContent=app.icon+' '+app.name;
        document.getElementById('tt-name').style.color=app.glow;
        document.getElementById('tt-desc').textContent=app.desc.substring(0,95)+'…';
        document.getElementById('tt-price').textContent='🚀 Clicca per aprire';
        tt.style.display='block';
        if(hovered!==p){ if(hovered) hovered.scale.set(1,1,1); hovered=p; }
        p.scale.lerp(new THREE.Vector3(1.25,1.25,1.25),0.15);
      }
    } else {
      canvas.style.cursor='grab';
      tt.style.display='none';
      if(hovered){ hovered.scale.lerp(new THREE.Vector3(1,1,1),0.15); if(hovered.scale.x<1.01){hovered.scale.set(1,1,1);hovered=null;} }
    }
  } else {
    tt.style.display='none';
    canvas.style.cursor='grabbing';
  }

  renderer.render(scene,camera);
}

// ─── RESIZE ──────────────────────────────────────────────────────────────────
window.addEventListener('resize',()=>{
  camera.aspect=W()/H(); camera.updateProjectionMatrix();
  renderer.setSize(W(),H());
});

// ─── LOADER ──────────────────────────────────────────────────────────────────
const bar=document.getElementById('load-bar');
bar.style.width='100%';
setTimeout(()=>{
  const loader=document.getElementById('loader');
  loader.style.opacity='0';
  setTimeout(()=>loader.style.display='none',800);
  animate();
},900);
</script>
